services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pantai_selat_baru_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env
      - web_public:/var/www/html/public
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coastal_net

  nginx:
    image: nginx:1.27-alpine
    container_name: pantai_selat_baru_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - web_public:/var/www/html/public:ro
      - storage_public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - coastal_net

  db:
    image: mysql:8.0
    container_name: pantai_selat_baru_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pantai_selat_baru}
      MYSQL_USER: ${DB_USERNAME:-abarox}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - coastal_net

networks:
  coastal_net:
    driver: bridge

volumes:
  db_data:
  storage_public:
  web_public:

